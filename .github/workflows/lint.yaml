name: Lint

on:
  push:
    branches: [staging, production]
  pull_request:

jobs:
  biome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Biome lint
        run: npx biome lint ./server