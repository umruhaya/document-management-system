services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: production
      POSTGRES_USER: main
      POSTGRES_PASSWORD: obviously_unsafe_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
